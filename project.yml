name: ClassicGames
options:
  bundleIdPrefix: practice.classicgames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    INFOPLIST_KEY_CFBundleDisplayName: "经典小游戏"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    ENABLE_PREVIEWS: "YES"
targets:
  ClassicGames:
    type: application
    platform: iOS
    sources:
      - path: ClassicGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: practice.classicgames.app
        PRODUCT_NAME: ClassicGames
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  ClassicGamesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ClassicGamesUITests
    dependencies:
      - target: ClassicGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: practice.classicgames.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ClassicGames
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  ClassicGames:
    build:
      targets:
        ClassicGames: all
        ClassicGamesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ClassicGamesUITests
          parallelizable: false
